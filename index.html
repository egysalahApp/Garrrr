                { q: "النصر لِلمظلوم.", a: "فائدة للمجرور", o: ["فائدة للمجرور", "السبب", "السماح"], h: "منفعة تُمنح.", e: "النصر حق ومنفعة." },
                { q: "غاب التلميذ لِمرض أصابه.", a: "السبب", o: ["السبب", "الغرض", "الملكية المعنوية"], h: "العلة والدافع.", e: "المرض هو السبب." },
                { q: "سافرت لِطلب العلم.", a: "الغرض", o: ["الغرض", "السبب", "السماح"], h: "الهدف المنشود.", e: "الطلب هو الغاية المرجوة." },
                { q: "يسمح لِلأطفال أن يلعبوا.", a: "السماح", o: ["السماح", "فائدة للمجرور", "السبب"], h: "رخصة.", e: "أفادت إعطاء الإذن." },
                { q: "انطلق المتسابق كَالسهم.", a: "التشبيه", o: ["التشبيه", "التفصيل", "السبب"], h: "مماثلة.", e: "شبه المتسابق بالسهم." },
                { q: "زرت أماكن أثرية كَمسجد الخميس.", a: "التفصيل", o: ["التفصيل", "التشبيه", "السماح"], h: "ذكر مثال.", e: "ذكر نموذج من الأماكن." }
            ]
        };

        // --- App Engine ---
        const App = {
            state: {
                activeTab: 'intro',
                answers: {}, // { g1: { 0: 'مكان الابتداء' } }
                completed: new Set()
            },

            init() {
                try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
                this.renderTabs();
                this.renderContent();
            },

            renderTabs() {
                const wrapper = document.getElementById('tabsWrapper');
                let html = '';
                
                TABS.forEach(tab => {
                    const isActive = this.state.activeTab === tab.id;
                    const isDone = this.state.completed.has(tab.id);
                    
                    let cls = `flex items-center gap-2 px-5 py-2.5 rounded-full text-base font-bold whitespace-nowrap transition-all border-2 interactive-btn `;
                    cls += isActive ? `bg-indigo-600 border-indigo-600 text-white shadow-md` : `bg-white border-slate-200 text-slate-500 hover:border-indigo-300`;

                    html += `
                        <button onclick="App.switchTab('${tab.id}')" id="btn-${tab.id}" class="${cls}">
                            <span class="text-xl">${tab.icon}</span>
                            <span>${tab.title}</span>
                            ${isDone ? `<svg class="w-5 h-5 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>` : ''}
                        </button>
                    `;
                });
                
                wrapper.innerHTML = html;

                // Progress Bar
                const prog = document.getElementById('progressBar');
                if (this.state.activeTab === 'intro') {
                    prog.style.width = '0%';
                } else {
                    const totalQs = DB[this.state.activeTab].length;
                    const ansQs = Object.keys(this.state.answers[this.state.activeTab] || {}).length;
                    prog.style.width = `${(ansQs / totalQs) * 100}%`;
                }
            },

            switchTab(tabId) {
                this.state.activeTab = tabId;
                this.renderTabs();
                this.renderContent();
                
                // Scroll Horizontal
                const btn = document.getElementById(`btn-${tabId}`);
                const container = document.getElementById('tabsWrapper');
                if (btn && container) {
                    const offset = btn.offsetLeft - (container.offsetWidth / 2) + (btn.offsetWidth / 2);
                    container.scrollBy({ left: offset, behavior: 'smooth' });
                }

                // Scroll Vertical
                const stickyNavHeight = document.getElementById('stickyNav').offsetHeight;
                window.scrollTo({ top: stickyNavHeight, behavior: 'smooth' });
            },

            renderContent() {
                const root = document.getElementById('contentRoot');
                const titleEl = document.getElementById('sectionTitle');
                const tabData = TABS.find(t => t.id === this.state.activeTab);
                
                titleEl.innerText = tabData.title;
                document.getElementById('globalResults').classList.add('hidden');

                if (this.state.activeTab === 'intro') {
                    this.renderIntro(root);
                } else {
                    this.renderQuiz(root, this.state.activeTab);
                }
                
                this.checkGlobal();
            },

            renderIntro(container) {
                const items = DB.intro;
                let html = `
                    <div class="bg-white rounded-[2rem] p-8 md:p-10 shadow-sm border border-slate-200">
                        <p class="text-xl text-slate-600 mb-8 leading-relaxed text-right">أهلاً بك! قمنا بتجميع وتلخيص <span class="font-bold text-indigo-600">٥٤ معنى نحوي</span> لحروف الجر. هذا التطبيق التفاعلي سيساعدك على التمييز بينها بسهولة.</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                `;
                
                items.forEach(item => {
                    html += `
                        <div class="flex items-center gap-4 p-5 rounded-2xl bg-slate-50 border border-slate-100">
                            <span class="text-3xl shrink-0">${item.i}</span>
                            <div>
                                <h3 class="text-xl font-bold text-indigo-900">${item.t}</h3>
                                <p class="text-slate-500 text-sm mt-1">${item.d}</p>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                        <button onclick="App.switchTab('g1')" class="w-full mt-10 py-5 bg-indigo-600 text-white text-xl font-bold rounded-2xl shadow-xl hover:bg-indigo-700 transition-colors interactive-btn">
                            انطلق للتحدي الأول
                        </button>
                    </div>
                `;
                container.innerHTML = html;
            },

            renderQuiz(container, tabId) {
                const qs = DB[tabId];
                const userAns = this.state.answers[tabId] || {};
                
                let html = '';
                
                qs.forEach((q, idx) => {
                    const hasAns = userAns[idx] !== undefined;
                    const chosen = userAns[idx];
                    const isCorrect = chosen === q.a;
                    
                    if (!q._opts) q._opts = shuffle([...q.o]);

                    html += `
                        <div class="bg-white rounded-[2rem] p-6 md:p-8 shadow-sm border border-slate-200">
                            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                                <span class="text-slate-400 font-bold text-lg">السؤال ${toAr(idx + 1)}</span>
                                <button onclick="App.toggleHint('hint-${idx}')" class="text-amber-500 font-bold flex items-center gap-2 bg-amber-50 px-4 py-1.5 rounded-full hover:bg-amber-100 transition-colors">
                                    💡 تلميح
                                </button>
                            </div>

                            <div id="hint-${idx}" class="smooth-grid-expand mb-5">
                                <div class="smooth-content">
                                    <div class="p-4 bg-amber-50 text-amber-800 rounded-2xl border border-amber-200 font-medium text-lg">
                                        👉 ${q.h}
                                    </div>
                                </div>
                            </div>

                            <h3 class="text-2xl font-bold text-slate-800 leading-snug mb-6 text-right">${q.q}</h3>
                            
                            <div class="grid gap-3">
                    `;

                    q._opts.forEach((opt, oIdx) => {
                        let btnCls = "interactive-btn w-full text-right p-4 rounded-xl text-xl font-medium border-2 flex items-center gap-4 ";
                        
                        if (!hasAns) {
                            btnCls += "border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50 text-slate-700 cursor-pointer";
                        } else {
                            if (opt === q.a) {
                                btnCls += "border-green-500 bg-green-50 text-green-900";
                            } else if (opt === chosen && !isCorrect) {
                                btnCls += "border-red-400 bg-red-50 text-red-900";
                            } else {
                                btnCls += "border-slate-100 bg-slate-50 text-slate-400 opacity-50 cursor-default";
                            }
                        }

                        html += `
                            <button ${hasAns ? 'disabled' : ''} onclick="App.submitAns('${tabId}', ${idx}, '${opt}')" class="${btnCls}">
                                <span class="w-9 h-9 flex items-center justify-center bg-white rounded-lg shadow-sm text-indigo-600 shrink-0 font-bold text-base">${toAr(oIdx + 1)}</span>
                                <span>${opt}</span>
                            </button>
                        `;
                    });

                    html += `
                            </div>
                            
                            <div id="feed-${idx}" class="smooth-grid-expand ${hasAns ? 'is-expanded' : ''} mt-6">
                                <div class="smooth-content">
                                    <div class="p-5 rounded-2xl ${hasAns && isCorrect ? 'bg-green-100 text-green-900 border border-green-200' : 'bg-red-50 text-red-900 border border-red-200'}">
                                        <p class="font-bold text-xl mb-1 flex items-center gap-2">
                                            ${hasAns && isCorrect ? '✅ إجابة صحيحة' : '❌ إجابة خاطئة'}
                                        </p>
                                        <p class="text-lg opacity-90 mt-2">${q.e}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                // Section Results
                if (Object.keys(userAns).length === qs.length) {
                    this.state.completed.add(tabId);
                    
                    let correctCount = 0;
                    for (let key in userAns) { if (userAns[key] === qs[key].a) correctCount++; }

                    html += `
                        <div class="bg-indigo-900 text-white rounded-[2rem] p-10 text-center shadow-xl mt-8">
                            <h4 class="text-2xl font-bold mb-3 opacity-80">النتيجة</h4>
                            <p class="text-6xl font-black mb-8">${toAr(correctCount)} <span class="text-3xl opacity-70">/ ${toAr(qs.length)}</span></p>
                            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                                <button onclick="App.retryTab('${tabId}')" class="px-8 py-4 bg-white/10 hover:bg-white/20 rounded-2xl font-bold text-xl transition-colors">إعادة القسم</button>
                                ${tabId !== 'g4' ? `
                                    <button onclick="App.nextTab()" class="px-8 py-4 bg-white text-indigo-900 hover:bg-indigo-50 rounded-2xl font-bold text-xl shadow-lg transition-colors">القسم التالي 👈</button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html;
            },

            toggleHint(id) {
                const el = document.getElementById(id);
                if(el) el.classList.toggle('is-expanded');
            },

            submitAns(tabId, qIdx, opt) {
                if (!this.state.answers[tabId]) this.state.answers[tabId] = {};
                this.state.answers[tabId][qIdx] = opt;
                
                this.renderTabs();
                this.renderContent();
            },

            retryTab(tabId) {
                delete this.state.answers[tabId];
                this.state.completed.delete(tabId);
                DB[tabId].forEach(q => delete q._opts);
                
                this.renderTabs();
                this.renderContent();
                
                const stickyNavHeight = document.getElementById('stickyNav').offsetHeight;
                window.scrollTo({ top: stickyNavHeight, behavior: 'smooth' });
            },

            nextTab() {
                const idx = TABS.findIndex(t => t.id === this.state.activeTab);
                if (idx < TABS.length - 1) this.switchTab(TABS[idx + 1].id);
            },

            checkGlobal() {
                const qTabs = TABS.filter(t => t.id !== 'intro');
                const allDone = qTabs.every(t => this.state.completed.has(t.id));
                const board = document.getElementById('globalResults');

                if (allDone) {
                    let s = 0, t = 0;
                    qTabs.forEach(tab => {
                        const ans = this.state.answers[tab.id] || {};
                        const qs = DB[tab.id];
                        t += qs.length;
                        for (let k in ans) { if (ans[k] === qs[k].a) s++; }
                    });

                    document.getElementById('finalScoreText').innerText = `${toAr(s)} / ${toAr(t)}`;
                    board.classList.remove('hidden');
                }
            },

            resetAll() {
                this.state.answers = {};
                this.state.completed.clear();
                Object.keys(DB).forEach(k => {
                    if (Array.isArray(DB[k])) DB[k].forEach(q => delete q._opts);
                });
                this.switchTab('intro');
            }
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
